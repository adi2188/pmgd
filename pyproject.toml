[project]
name = "poorgraph"
version = "0.1.0"
description = "A minimal poor man's graph service with tabular persistence and recovery."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Kulkarni" }]
dependencies = []

[project.scripts]
poorgraph = "poorgraph.api:main"
poorgraph-demo = "poorgraph.demo:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
